[project]
name = "winterview-backend"
version = "0.1.0"
description = "WINterview — behavioral interview practice backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "motor>=3.6",
    "pymongo>=4.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "google-auth>=2.35",
    "pyjwt>=2.9",
    "google-genai>=0.3",
    "elevenlabs>=1.10",
    "pypdf>=6.10.2",
]

[tool.uv]
package = false
